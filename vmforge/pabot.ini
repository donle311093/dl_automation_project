# VMForge default pabot settings.
# Read by `vmforge run` when --processes is not given on the command line.
# To override: vmforge run --platform windows --tag REG1 --processes 8
#
# 14 matches the recommended concurrency for a vSphere lab with 14 clone slots
# (one VM per product suite).  Scale down for smaller environments.

[pabot]
processes = 14
