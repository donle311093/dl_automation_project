[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vmforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "robotframework>=7.0",
    "robotframework-pabot>=2.0",
    "pyvmomi>=8.0",
    "paramiko>=3.0",
    "typer>=0.12",
    "openpyxl>=3.1",
    "filelock>=3.13",
]

[project.scripts]
vmforge = "vmforge.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
